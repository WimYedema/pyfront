[project]
name = "pyfront"
version = "0.1.0"
description = "DSL front-end generator"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
]

[project.scripts]
pyfront = "src.__main__:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
